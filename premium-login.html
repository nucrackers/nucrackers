<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Premium Login | NU Crackers</title>
<link rel="icon" href="assets/logo.jpg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  body { min-height: 100vh; display: flex; align-items: center; background: #f5f6fa; }
  .login-card { max-width: 420px; width: 100%; margin: auto; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
</style>
</head>
<body>

<div class="container">
  <div class="card login-card p-4">
    <div class="text-center mb-3">
      <img src="images/nu crackers logo.jpg" alt="NU Crackers" style="height:50px;">
      <h4 class="fw-bold mt-3">Premium Batch Login</h4>
      <p class="text-muted small">শুধুমাত্র Premium Batch-এর শিক্ষার্থীরা এখানে লগইন করতে পারবে।</p>
    </div>

    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label class="form-label fw-semibold">তোমার নাম</label>
        <input type="text" id="studentName" class="form-control" placeholder="যেমন: Rahim Ahmed" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">রোল নম্বর</label>
        <input type="text" id="studentRoll" class="form-control" placeholder="যেমন: 101" required>
      </div>
      <button type="submit" class="btn btn-brand w-100">Login</button>
      <div id="loginMessage" class="d-none"></div>
    </form>

    <div class="text-center mt-3">
      <a href="courses.html" class="small text-muted"><i class="fa-solid fa-arrow-left me-1"></i>ফিরে যাও</a>
    </div>
  </div>
</div>

<script type="module" src="js/premium-login.js"></script>
</body>
</html>
