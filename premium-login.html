<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Premium Batch Login | NU Crackers</title>
  <link rel="icon" href="images/nu crackers logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      min-height: 100vh;
      background: radial-gradient(circle at 10% 20%, rgba(13,110,253,0.06) 0%, rgba(16,42,86,0.03) 90%), #f8fafc;
      display: flex;
      flex-direction: column;
    }
    .login-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 15px;
    }
    .auth-card {
      width: 100%;
      max-width: 480px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      border: 1px solid rgba(0,0,0,0.05);
      overflow: hidden;
    }
    .auth-header {
      background: linear-gradient(135deg, #0d3b66 0%, #1f4e79 100%);
      color: #ffffff;
      padding: 30px 24px;
      text-align: center;
    }
    .auth-header img {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255,255,255,0.4);
    }
    .auth-body {
      padding: 30px 24px;
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-expand-lg bg-white border-bottom py-2 shadow-sm">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="index.html">
        <img src="images/nu crackers logo.jpg" alt="NU Crackers Logo" style="height: 38px; width: 38px; border-radius: 50%;">
        <span class="fw-bold fs-5 text-dark">NU Crackers</span>
      </a>
      <div class="ms-auto d-flex align-items-center gap-2">
        <a href="courses.html" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
          <i class="fa-solid fa-arrow-left me-1"></i> Our Courses
        </a>
      </div>
    </div>
  </nav>

  <div class="login-container">
    <div class="auth-card">
      <div class="auth-header">
        <img src="images/nu crackers logo.jpg" alt="NU Crackers Logo" class="mb-3">
        <h3 class="fw-bold mb-1">Premium Batch Exam Portal</h3>
        <p class="text-white-50 small mb-0">স্বপ্ন জয়ের বিশ্বস্ত সারথি • National University Admission</p>
      </div>

      <div class="auth-body">
        <div id="alertBox" class="alert d-none py-2 px-3 small rounded-3 mb-3"></div>

        <div class="text-center mb-4">
          <h4 class="fw-bold text-dark mb-1">Login</h4>
          <p class="text-muted small mb-0">
            তোমার প্রিমিয়াম ব্যাচের রোল নম্বর ও নাম দিয়ে প্রবেশ করো
          </p>
        </div>

        <form id="loginForm">
          <div class="mb-3">
            <label for="loginRoll" class="form-label fw-semibold text-dark small">ইউনিক রোল নম্বর (Unique Roll)</label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-id-card"></i></span>
              <input type="text" class="form-control" id="loginRoll" required autocomplete="off">
            </div>
          </div>

          <div class="mb-4">
            <label for="loginName" class="form-label fw-semibold text-dark small">শিক্ষার্থীর পূর্ণ নাম (Full Name)</label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-user"></i></span>
              <input type="text" class="form-control" id="loginName" required autocomplete="off">
            </div>
          </div>

          <button type="submit" id="loginSubmitBtn" class="btn btn-brand w-100 py-2 fw-semibold">
            <span class="normal-state"><i class="fa-solid fa-arrow-right-to-bracket me-2"></i>লগইন করে সরাসরি গ্রুপ পোর্টালে যাও</span>
            <span class="loading-state d-none"><span class="spinner-border spinner-border-sm me-2"></span>যাচাই করা হচ্ছে...</span>
          </button>
        </form>

        <hr class="my-4 text-muted opacity-25">

        <div class="text-center">
          <p class="small text-muted mb-2">প্রিমিয়াম ব্যাচে এখনো ভর্তি হওনি?</p>
          <a href="https://forms.gle/JjQ8LtMdgqZKAsus5" target="_blank" class="btn btn-outline-primary btn-sm rounded-pill px-3">
            <i class="fa-solid fa-pen-nib me-1"></i> ভর্তির ফর্ম পূরণ করো
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/premium-login.js"></script>
</body>
</html>
