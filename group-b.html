<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Group B | Premium Live Exam | NU Crackers</title>
<link rel="icon" href="assets/logo.jpg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-group="group-b">

<nav class="navbar navbar-expand-lg sticky-top">
  <div class="container d-flex justify-content-between">
    <span class="navbar-brand">Group B — Live Exam</span>
    <div>
      <span id="welcomeText" class="me-3"></span>
      <button id="logout-btn" class="btn btn-outline-danger btn-sm">Logout</button>
    </div>
  </div>
</nav>

<div class="container py-4">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <button id="start-exam-btn" class="btn btn-brand">পরীক্ষা শুরু করো</button>
    <h4 id="timer">--:--</h4>
  </div>

  <div id="question-container"></div>

  <button id="submit-btn" class="btn btn-success d-none mb-4">Submit Exam</button>

  <div id="result-box" class="alert alert-info d-none fw-bold fs-5"></div>
  <div id="review-box"></div>

  <hr class="my-4">

  <h4 class="fw-bold mb-3"><i class="fa-solid fa-trophy me-2"></i>Group B Leaderboard</h4>
  <ul id="leaderboard-list" class="list-group"></ul>

</div>

<script type="module" src="js/premium-exam.js"></script>
</body>
</html>
